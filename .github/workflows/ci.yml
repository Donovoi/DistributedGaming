name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install oracle build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libvulkan-dev libssl-dev
      - name: Build native oracle
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-missing-field-initializers tools/native-oracle/main.cpp -lvulkan -lcrypto -o /tmp/native-oracle
      - name: Check rejected oracle inputs
        run: python3 tools/native-oracle/test_inputs.py /tmp/native-oracle
      - name: Install observer Rust components
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Check observer format
        run: cargo +1.93.1 fmt --manifest-path tools/vulkan-observer/Cargo.toml --check
      - name: Check observer code
        run: cargo +1.93.1 clippy --manifest-path tools/vulkan-observer/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test observer forwarding and lifetimes
        run: cargo +1.93.1 test --manifest-path tools/vulkan-observer/Cargo.toml --all-targets --locked
      - name: Build observer
        run: cargo +1.93.1 build --manifest-path tools/vulkan-observer/Cargo.toml --release --locked
      - name: Check observer ABI and loader symbols
        run: |
          cc -std=c11 -Wall -Wextra -Werror tools/vulkan-observer/check_abi.c -o /tmp/check-abi
          /tmp/check-abi
          cc -std=c11 -Wall -Wextra -Werror tools/vulkan-observer/check_loader.c -lvulkan -ldl -o /tmp/check-loader
          /tmp/check-loader "$PWD/tools/vulkan-observer/target/release/libdg_vulkan_observer.so"
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Rust components
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Check format
        run: cargo +1.93.1 fmt --check
      - name: Check code
        run: cargo +1.93.1 clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +1.93.1 test --all-targets --locked
      - name: Build release
        run: cargo +1.93.1 build --release --locked
      - name: Check GPU probe format
        run: cargo +1.93.1 fmt --manifest-path tools/reduction-probe/Cargo.toml --check
      - name: Check GPU probe code
        run: cargo +1.93.1 clippy --manifest-path tools/reduction-probe/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test GPU probe input checks
        run: cargo +1.93.1 test --manifest-path tools/reduction-probe/Cargo.toml --all-targets --locked
      - name: Check synthetic fixture identities
        run: python tools/reduction-probe/make_synthetic.py runs/reduction-synthetic
      - name: Build GPU probe
        run: cargo +1.93.1 build --manifest-path tools/reduction-probe/Cargo.toml --release --locked
      - name: Check progress
        run: python scripts/check_progress.py
      - name: Test progress checks
        run: python scripts/test_progress.py
      - name: Check saved CS2 baseline
        run: python scripts/check_cs2_baseline.py
      - name: Require README change in each PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: python scripts/check_progress.py --base "$PR_BASE"
