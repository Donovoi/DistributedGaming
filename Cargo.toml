[package]
name = "distributed-gaming"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false
description = "Measured LAN work sharing for game rendering research"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
